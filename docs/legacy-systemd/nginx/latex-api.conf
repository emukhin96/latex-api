# Конфигурация Nginx для LaTeX API сервиса

server {
    listen 80;
    server_name latex-api.your-domain.com;  # Замените на ваш домен
    
    # Редирект на HTTPS (раскомментировать после настройки SSL)
    # return 301 https://$server_name$request_uri;
    
    # Или проксировать на Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты для длительных операций компиляции
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
    
    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}

