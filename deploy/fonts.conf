<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Шрифты проектов (Circe, CMU, PPNeueMachina, …) монтируются в /opt/latex-api/fonts;
     fontconfig делает их доступными XeLaTeX по имени семейства (\setmainfont{Circe}). -->
<fontconfig>
  <dir>/opt/latex-api/fonts</dir>
  <!-- Type1 (.pfb/.pfa) в fontspec не годятся: xdvipdfmx не встраивает их через fontconfig.
       Шаблон glob в fontconfig не переходит через «/», поэтому перечислены уровни вложенности. -->
  <selectfont>
    <rejectfont>
      <glob>/opt/latex-api/fonts/*.pfb</glob>
      <glob>/opt/latex-api/fonts/*/*.pfb</glob>
      <glob>/opt/latex-api/fonts/*/*/*.pfb</glob>
      <glob>/opt/latex-api/fonts/*.pfa</glob>
      <glob>/opt/latex-api/fonts/*/*.pfa</glob>
      <glob>/opt/latex-api/fonts/*/*/*.pfa</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
