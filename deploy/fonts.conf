<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Шрифты проектов (Circe, CMU, PPNeueMachina, …) монтируются в /opt/latex-api/fonts;
     fontconfig делает их доступными XeLaTeX по имени семейства (\setmainfont{Circe}). -->
<fontconfig>
  <dir>/opt/latex-api/fonts</dir>
  <!-- Type1-шрифты (.pfb) в fontconfig не нужны: XeTeX с fontspec подхватывает их для семейств,
       у которых есть и OpenType-версия (CMU из TeX Live), а xdvipdfmx такой шрифт не встраивает —
       «Error occurred while loading font …cmunss.pfb». Отсекаем по формату, откуда бы они ни пришли. -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="fontformat"><string>Type 1</string></patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
